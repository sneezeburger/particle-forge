<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>PARTICLE FORGE — remote control</title>
<style>
  :root{
    --bg:#05060f; --glass: rgba(18,20,42,.72); --stroke: rgba(150,180,255,.18);
    --txt:#dfe6ff; --dim:#8b95c9; --accent:#6ef3ff; --accent2:#ff5edb;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    -webkit-tap-highlight-color:transparent;}
  body{padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));}
  h1{font-size:15px;letter-spacing:.08em;margin:0 0 4px;color:var(--accent)}
  #status{font-size:11px;color:var(--dim);margin-bottom:16px}
  #status.live{color:#7CFC9A}
  #status.dead{color:var(--accent2)}
  .sec{font-size:10px;letter-spacing:.12em;color:var(--dim);margin:18px 0 6px;text-transform:uppercase}
  .row{display:flex;justify-content:space-between;font-size:12px;margin-top:10px}
  .row span:last-child{color:var(--accent)}
  input[type=range]{width:100%;accent-color:var(--accent);margin-top:2px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  button{background:var(--glass);border:1px solid var(--stroke);color:var(--txt);
    border-radius:10px;padding:10px 6px;font:inherit;font-size:11px;letter-spacing:.03em;
    cursor:pointer;}
  button.on{border-color:var(--accent);color:var(--accent)}
  button:active{transform:scale(.97)}
</style>
</head>
<body>
<h1>PARTICLE FORGE — REMOTE</h1>
<div id="status">connecting…</div>

<div class="sec">presets</div>
<div class="grid" id="presets"></div>

<div class="sec">simulation</div>
<div id="sliders-simulation"></div>

<div class="sec">force field</div>
<div id="sliders-force"></div>

<div class="sec">render</div>
<div id="sliders-render"></div>
<div class="grid" id="render-toggles"></div>

<div class="sec">actions</div>
<div class="grid" id="action-toggles"></div>

<script>
const SLIDERS = [
  { key:'count', label:'particles',         cat:'simulation', min:300, max:9000, step:100, fmt:x=>x,
    desc:'Number of particles simulated. Higher values add detail but cost FPS.' },
  { key:'grav',  label:'gravity',            cat:'simulation', min:-40, max:80,   step:1,   fmt:x=>(x/10).toFixed(2),
    desc:'Constant downward (or upward) pull applied to every particle.' },
  { key:'press', label:'pressure',           cat:'simulation', min:0,   max:900,  step:10,  fmt:x=>x,
    desc:'Repulsion strength that keeps nearby particles from overlapping.' },
  { key:'coh',   label:'cohesion',           cat:'simulation', min:0,   max:500,  step:5,   fmt:x=>x,
    desc:'Attraction pulling nearby particles together, like surface tension.' },
  { key:'visc',  label:'viscosity',          cat:'simulation', min:0,   max:100,  step:1,   fmt:x=>(x/100).toFixed(2),
    desc:'Damps relative velocity between neighbors, making flow thicker.' },
  { key:'rad',   label:'radius',             cat:'simulation', min:6,   max:40,   step:1,   fmt:x=>x,
    desc:'Interaction radius — how far neighboring particles can affect each other.' },
  { key:'drag',  label:'drag',               cat:'simulation', min:0,   max:80,   step:1,   fmt:x=>(x/10).toFixed(1)+'%',
    desc:'Air resistance that drains particle velocity over time.' },
  { key:'wells', label:'wells',              cat:'force',      min:0,   max:8,    step:1,   fmt:x=>x,
    desc:'Number of attracting/repelling gravity wells active in the scene.' },
  { key:'mass',  label:'well mass',          cat:'force',      min:0,   max:300,  step:5,   fmt:x=>(x/100).toFixed(2),
    desc:"Strength of each force well's pull." },
  { key:'spin',  label:'vortex spin',        cat:'force',      min:-100,max:100,  step:1,   fmt:x=>(x/100).toFixed(2),
    desc:'Rotational force applied around the force-well centers (no effect without wells).' },
  { key:'ptr',   label:'pointer force',      cat:'force',      min:0,   max:300,  step:5,   fmt:x=>(x/100).toFixed(2),
    desc:'How strongly your pointer or touch attracts/repels nearby particles.' },
  { key:'tilt',  label:'tilt force',         cat:'force',      min:0,   max:300,  step:5,   fmt:x=>(x/100).toFixed(2),
    desc:'How strongly device tilt (motion sensors) steers particles.' },
  { key:'trail', label:'trail persistence',  cat:'render',     min:0,   max:99,   step:1,   fmt:x=>(x/100).toFixed(2),
    desc:'How long particle motion trails linger before fading out.' },
  { key:'size',  label:'particle size',      cat:'render',     min:20,  max:400,  step:5,   fmt:x=>(x/100).toFixed(2),
    desc:'Rendered size of each particle.' },
  { key:'glow',  label:'glow',               cat:'render',     min:0,   max:100,  step:1,   fmt:x=>(x/100).toFixed(2),
    desc:'Intensity of additive glow/bloom around particles.' },
];
const COLOR_NAMES  = ['VELOCITY','DENSITY','SPECTRUM','HEAT'];
const BOUND_NAMES  = ['BOUNCE','WRAP','VOID'];
const QUAL_NAMES   = ['AUTO','HIGH','BALANCED','SPEED'];
const PRESETS = ['nebula','fluid','galaxy','storm','web','zerog','sun'];
const PRESET_DESC = {
  nebula: 'Drifting colorful cloud with gentle cohesion and soft force wells.',
  fluid:  'Thick, syrupy fluid that sloshes and bounces off the edges.',
  galaxy: 'Orbiting disc of particles swirling around twin gravity wells.',
  storm:  'Chaotic turbulence with spinning vortices and many force wells.',
  web:    'Sparse mesh of linked particles tracing a web-like structure.',
  zerog:  'Free-floating particles with no gravity or cohesion.',
  sun:    'Dense, fast-spinning hot core pushing particles outward.',
};
const RENDER_TOGGLES = [
  { id:'b_color',   action:'color',   desc:'Cycle particle coloring mode (velocity / density / spectrum / heat).' },
  { id:'b_bounds',  action:'bounds',  desc:'Cycle what happens at the simulation edges (bounce / wrap / void).' },
  { id:'b_links',   action:'links',   desc:'Toggle lines drawn between nearby particles.' },
  { id:'b_wellviz', action:'wellviz', desc:'Toggle visibility of force well markers.' },
  { id:'b_quality', action:'quality', desc:'Cycle render quality / performance mode.' },
  { id:'b_imu',     action:'imu',     desc:'Toggle device motion (tilt / shake) control.' },
];
const ACTION_TOGGLES = [
  { id:'b_burst', action:'burst', desc:'Trigger an outward shockwave burst from the center.' },
  { id:'b_reset', action:'reset', desc:'Reset the simulation to its initial state.' },
  { id:'b_pause', action:'pause', desc:'Pause or resume the simulation.' },
];

const el = id => document.getElementById(id);
const statusEl = el('status');

// build preset buttons
const presetsHost = el('presets');
const presetBtns = {};
for (const name of PRESETS){
  const btn = document.createElement('button');
  btn.id = 'p_' + name;
  btn.textContent = name.toUpperCase();
  btn.title = PRESET_DESC[name] || '';
  btn.addEventListener('click', () => send({ type: 'preset', name }));
  presetsHost.appendChild(btn);
  presetBtns[name] = btn;
}

// build sliders, grouped by category
const sliderHosts = {
  simulation: el('sliders-simulation'),
  force: el('sliders-force'),
  render: el('sliders-render'),
};
const rowEls = {};
for (const s of SLIDERS){
  const host = sliderHosts[s.cat];
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<span title="${s.desc}">${s.label}</span><span id="v_${s.key}">—</span>`;
  const input = document.createElement('input');
  input.type = 'range'; input.id = 'r_' + s.key;
  input.min = s.min; input.max = s.max; input.step = s.step;
  input.title = s.desc;
  host.appendChild(row);
  host.appendChild(input);
  rowEls[s.key] = { input, valEl: el('v_' + s.key), dragging: false };
  input.addEventListener('pointerdown', () => rowEls[s.key].dragging = true);
  input.addEventListener('pointerup',   () => rowEls[s.key].dragging = false);
  input.addEventListener('input', () => {
    rowEls[s.key].valEl.textContent = s.fmt(+input.value);
    send({ type: 'set', key: s.key, value: +input.value });
  });
}

let ws = null;
function send(msg){ if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg)); }
function action(name){ send({ type: 'action', name }); }

// build render + action toggle buttons
const renderHost = el('render-toggles');
for (const t of RENDER_TOGGLES){
  const btn = document.createElement('button');
  btn.id = t.id; btn.title = t.desc;
  btn.addEventListener('click', () => action(t.action));
  renderHost.appendChild(btn);
}
const actionHost = el('action-toggles');
for (const t of ACTION_TOGGLES){
  const btn = document.createElement('button');
  btn.id = t.id; btn.title = t.desc;
  btn.addEventListener('click', () => action(t.action));
  actionHost.appendChild(btn);
}

function applyState(state){
  for (const name of PRESETS) presetBtns[name].classList.toggle('on', state.preset === name);
  for (const s of SLIDERS){
    if (!(s.key in state)) continue;
    const r = rowEls[s.key];
    if (r.dragging) continue; // don't fight an in-progress local drag
    if (document.activeElement !== r.input) r.input.value = state[s.key];
    r.valEl.textContent = s.fmt(+r.input.value);
  }
  el('b_color').textContent   = 'COLOR: ' + (COLOR_NAMES[state.color] ?? '?');
  el('b_bounds').textContent  = 'EDGE: ' + (BOUND_NAMES[state.bounds] ?? '?');
  el('b_links').textContent   = 'LINKS: ' + (state.links ? 'ON' : 'OFF');
  el('b_links').classList.toggle('on', !!state.links);
  el('b_wellviz').textContent = 'WELLS: ' + (state.wellviz ? 'SHOWN' : 'HIDDEN');
  el('b_wellviz').classList.toggle('on', !!state.wellviz);
  el('b_quality').textContent = 'QUALITY: ' + (QUAL_NAMES[state.quality] ?? '?');
  el('b_quality').classList.toggle('on', state.quality !== 0);
  el('b_imu').textContent     = 'MOTION: ' + (state.imu ? 'ON' : 'OFF');
  el('b_imu').classList.toggle('on', !!state.imu);
  el('b_pause').textContent   = state.paused ? 'RESUME' : 'PAUSE';
  el('b_pause').classList.toggle('on', !!state.paused);
}

function connect(){
  statusEl.textContent = 'connecting…'; statusEl.className = '';
  try { ws = new WebSocket(`wss://${location.host}`); }
  catch (err) { setTimeout(connect, 3000); return; }
  ws.addEventListener('open', () => { statusEl.textContent = 'connected'; statusEl.className = 'live'; });
  ws.addEventListener('message', ev => {
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }
    if (msg.type === 'state') applyState(msg.state);
  });
  ws.addEventListener('close', () => {
    statusEl.textContent = 'disconnected — retrying…'; statusEl.className = 'dead';
    setTimeout(connect, 3000);
  });
  ws.addEventListener('error', () => ws.close());
}
connect();
</script>
</body>
</html>
